# Archivo generado automaticamente desde public-manifest.yml y public/mkdocs-base.yml.
# No editar a mano: regenera con `python3 scripts/generar_nav_mkdocs.py`.

site_name: IAW - ASIR
site_description: Apuntes y practicas del modulo Implantacion de Aplicaciones Web
site_url: https://TU_USUARIO.github.io/iaw-alumnos/
repo_name: TU_USUARIO/iaw-alumnos
repo_url: https://github.com/TU_USUARIO/iaw-alumnos
edit_uri: ''
theme:
  name: material
  language: es
  features:
  - navigation.instant
  - navigation.sections
  - navigation.expand
  - navigation.top
  - content.code.copy
  - search.suggest
  - search.highlight
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
  icon:
    repo: fontawesome/brands/github
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
extra_css:
- assets/stylesheets/extra.css
not_in_nav: '**/practica-2-sol.md

  **/examen-validacion-escrito.md

  **/solucion_practica_1/**

  **/solucion_practica_2/**

  UTX/**'
nav:
- Inicio: index.md
- Git y GitHub para entregas: git-github-entregas.md
- Entregas: entregas.md
